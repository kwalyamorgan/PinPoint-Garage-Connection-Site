version: '3.8'

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pinpoint
      POSTGRES_USER: pinpoint_user
      POSTGRES_PASSWORD: mmmm
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://pinpoint_user:mmmm@postgres:5432/pinpoint
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=secret123
      - FRONTEND_ORIGIN=http://localhost:5173
      - NODE_ENV=development
      - START_FRONTEND=false
    ports:
      - "4000:4000"
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE=http://localhost:4000/api
      - NODE_ENV=development
    ports:
      - "5173:5173"
    command: ["npm","run","dev","--","--host","0.0.0.0"]
    depends_on:
      - backend

volumes:
  pgdata:
